# SilentSDDM Rosé Pine Theme
# Author : uiriansan, bpanca05
# Description : All natural pine, faux fur and a bit of soho vibes for the classy minimalist theme for SilentSDDM

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = fill

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = smoky-placeholder
use-background-color = true
background-color = #191724
blur = 0
brightness = 0.0
saturation = 0.0

[LockScreen.Clock]
display = true
position = center
align = center
format = hh:mm
font-family = Inter
font-size = 70
font-weight = 900
color = #e0def4

[LockScreen.Date]
display = true
format = dd, dd MM yyyy
locale = "en_US"
font-family = Inter
font-size = 14
font-weight = 600
color = #e0def4
margin-top = -15

[LockScreen.Message]
display = true
position = bottom-center
align = center
text = Press any key
font-family = Inter
font-size = 12
font-weight = 400
display-icon = true
icon = enter.svg
icon-size = 16
color = #e0def4
paint-icon = true
spacing = 0

[LoginScreen]
background = smoky-placeholder
use-background-color = true
background-color = #191724
blur = 0
brightness = 0.0
saturation = 0.0

[LoginScreen.LoginArea]
position = center
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = circle
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 2
inactive-border-size = 2
active-border-color = #c4a7e7
inactive-border-color = $highlight-high

[LoginScreen.LoginArea.Username]
font-family = Inter
font-size = 16
font-weight = 700
color = #e0def4
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 200
height = 30
display-icon = true
font-family = Inter
font-size = 12
icon = password.svg
icon-size = 16
content-color = #e0def4
background-color = #1f1d2e
background-opacity = 1
border-size = 2
border-color = #c4a7e7
border-radius-left = 10
border-radius-right = 10
margin-top = 10

[LoginScreen.LoginArea.LoginButton]
background-color = #1f1d2e
background-opacity = 1
active-background-color = #26233a
active-background-opacity = 1
icon = arrow-right.svg
icon-size = 18
content-color = #e0def4
active-content-color = #e0def4
border-size = 0
border-color = #c4a7e7
border-radius-left = 10
border-radius-right = 10
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = true
font-family = Inter
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = Inter
font-weight = 600
font-size = 14
icon-size = 30
icon = spinner.svg
color = #e0def4
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = Inter
font-size = 11
font-weight = 400
normal-color = #e0def4
warning-color = #f6c177
error-color = #eb6f92
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 30
border-radius = 5
spacing = 10
font-family = Inter

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = #1f1d2e
background-opacity = 1
active-option-background-color = #26233a
active-option-background-opacity = 1
content-color = #e0def4
active-content-color = #e0def4
font-family = Inter
border-size = 1
border-color = #c4a7e7
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = bottom-center
index = 0
popup-direction = up
popup-align = center
display-session-name = true
button-width = 200
popup-width = 200
background-color = #1f1d2e
background-opacity = 1
active-background-opacity = 1
content-color = #e0def4
active-content-color = #e0def4
border-size = 1
border-color = #e0def4
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = bottom-center
index = 0
popup-direction = up
popup-align = center
popup-width = 180
display-layout-name = true
background-color = #1f1d2e
background-opacity = 1
active-background-opacity = 1
content-color = #e0def4
active-content-color = #e0def4
border-size = 1
border-color = #e0def4
font-size = 10
icon = language.svg
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = bottom-center
index = 0
background-color = #1f1d2e
background-opacity = 1
active-background-opacity = 1
content-color = #e0def4
active-content-color = #e0def4
border-size = 1
border-color = #e0def4
icon = keyboard.svg
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = bottom-center
index = 0
popup-direction = right
popup-align = center
popup-width = 90
background-color = #1f1d2e
background-opacity = 1
active-background-opacity = 1
content-color = #e0def4
active-content-color = #e0def4
border-size = 1
border-color = #e0def4
icon = power.svg
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = login
start-hidden = true
background-color = #1f1d2e
background-opacity = 1
key-content-color = #e0def4
key-color = #26233a
key-opacity = 1
key-active-background-color = #26233a
key-active-opacity = 1
selection-background-color = #c4a7e7
selection-content-color = #1f1d2e
primary-color = #e0def4
border-size = 1
border-color = #c4a7e7

[Tooltips]
enable = false
font-family = Inter
font-size = 13
content-color = #e0def4
background-color = #1f1d2e
background-opacity = 1
border-radius = 5
disable-user = false
disable-login-button = false
