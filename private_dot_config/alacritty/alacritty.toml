[general]
import = [ "~/.config/alacritty/rose-pine.toml"]
live_config_reload = true

[window]
startup_mode = "Windowed"
# title = "Alacritty Terminal"
# dynamic_title = true # default value is true

[cursor]
style = "Beam"
thickness = 0.15
unfocused_hollow = false

### Smooth cursor option
### Only compatible with smooth cursor Alacritty patch by GregTheMadMonk
### https://github.com/GregTheMadMonk/alacritty-smooth-cursor

## Set to false to disable completely
smooth_motion = true
## 0.0 = cursor is not moving, 1.0 = cursor moves instantly
smooth_motion_factor = 0.6
## 0.0 = broken, 1.0 = cursor shape is unaffected by movement
smooth_motion_spring = 0.6
## Limits how the cursor size may change
smooth_motion_max_stretch_x = 3.0
smooth_motion_max_stretch_y = 1.0
## Override "block" cursor if you don't like how it looks in this fork
## I prefer "underline"
block_replace_shape = "None"

[font]
size = 14
[font.normal]
family = "HexaMono"
style = "Regular"
[font.bold]
family = "HexaMono"
style = "Bold"

[mouse]
hide_when_typing = true

[env]
TERM = "alacritty"

## Consider to use Tmux at start since Alacritty doesn't have native mux function
[terminal]
shell = {program = "/usr/bin/tmux", args = ["new", "-n", "KangHexa"]}

